# Migrated for refactored custom_query config system.
#
# Reporter snapshot (legacy layout on disk — use these as reference when reconciling a node):
# - og_custom_query_config.toml    — same query/endpoint blocks as this file (HTTP templates + contracts).
# - og_market_params.toml         — chain market list + ExchangeConfigJson per market Id/Pair.
#   Deploy under the node home as `config/market_params.toml` (or merge with the live file from chain).
#   The downloaded snapshot may be a subset; custom oracle markets (TBTC-USD, stATOM-USD, …) must
#   appear in the merged market_params with the same QueryData bytes the chain uses for that feed.
# - og_pricefeed_exchange_config.toml — exchange poll intervals (reference; consolidated reporter does not
#   start the legacy pricefeed client).
#
# Query id (`queries.<id>` / `id = "..."`): must match reporter routing: keccak256(raw query bytes),
# i.e. hex(Keccak256(decode_hex(MarketParam.QueryData))) as in `layer/utils.QueryIDFromData`.
# ResolveMarketIdForQuery accepts either that id or the raw QueryData hex for a market row.
#
# Exchange endpoints (`endpoint_type = "exchange"`):
# - `exchange_id` must appear in that market's ExchangeConfigJson (same names as pricefeed, e.g. CoinbaseRates).
# - `market_id` is optional (telemetry/labels only; chain market is resolved from query id).
# - `use_cache` optional (default false); if true, reads MarketToExchangePrices (needs a cache writer).
# - Do not set REST-only fields: `response_path`, `params`, `handler`, `chain`.
#
# Example exchange leg (add under `[[queries.<query_id>.endpoints]]` when the market row lists the exchange):
#   endpoint_type = "exchange"
#   exchange_id = "CoinbaseRates"
#   market_id = "TBTC-USD"
#   use_cache = false
# Optional strict ticker check vs canonical JSON:
#   ticker = "TBTC-USD"
#
# Spot markets from `og_market_params.toml` (below): query id = keccak256(hex_decode(QueryData)); use
# `go run ./scripts/keccak_queryids` to recompute when QueryData changes. Those ids differ from the
# custom-oracle query hashes earlier in this file, so exchange legs are added as separate queries — not
# merged into SDAI/TBTC/stATOM/etc. (same query id always resolves one chain `MarketId`). When your live
# `market_params.toml` includes a row whose keccak id matches an existing custom query, copy the exchange
# `[[endpoints]]` blocks onto that query to add sources without removing anything.

# This is a TOML config file.
[endpoints]
    [endpoints.coinbase]
    url_template = "https://api.coinbase.com/v2/prices/{currency_pair}/spot"
    method = "GET"
    timeout = 5000
    [endpoints.coingecko]
    url_template = "https://api.coingecko.com/api/v3/simple/price?ids={coin_id}&vs_currencies=usd"
    method = "GET"
    timeout = 5000
    [endpoints.coingeckoPro]
    url_template = "https://pro-api.coingecko.com/api/v3/simple/price?ids={coin_id}&vs_currencies=usd&x_cg_pro_api_key=CG-kDqZseceEndaH6gkDNLUayim"
    method = "GET"
    timeout = 5000
    [endpoints.coinmarketcap]
    url_template = "https://pro-api.coinmarketcap.com/v1/cryptocurrency/quotes/latest?id={id}"
    method = "GET"
    timeout = 5000
    api_key = "${CMC_PRO_API_KEY}"
    headers = { Accept = "application/json", X-CMC_PRO_API_KEY = "api_key" }
    [endpoints.coinpaprika]
    url_template = "https://api.coinpaprika.com/v1/tickers/{coin_id}?quotes=USD"
    method = "GET"
    timeout = 5000
    [endpoints.crypto]
    url_template = "https://api.crypto.com/v2/public/get-ticker?instrument_name={instrument_name}"
    method = "GET"
    timeout = 5000
    [endpoints.curve]
    url_template = "https://prices.curve.finance/v1/usd_price/ethereum/{contract_address}"
    method = "GET"
    timeout = 5000
    [endpoints.osmosis]
    url_template = "https://lcd.osmosis.zone/osmosis/gamm/v1beta1/pools/{pool_id}"
    method = "GET"
    timeout = 5000
    [endpoints.sushiswapKatana]
    url_template = "https://api.sushi.com/price/v1/747474"
    method = "GET"
    timeout = 5000
    [endpoints.uniswapV3ethereum]
    url_template = "https://gateway.thegraph.com/api/{api_key}/subgraphs/id/5zvR82QoaXYFyDEKLZ9t6v9adgnptxYpKpSbxtgVENFV"
    method = "POST"
    timeout = 5000
    query = '''{"query": "{ token(id: \"{token_address}\") { derivedETH } }"}'''
    api_key = "${SUBGRAPH_API_KEY}"
    headers = { Content-Type = "application/json" }
    [endpoints.uniswapV4ethereum]
    url_template = "https://gateway.thegraph.com/api/{api_key}/subgraphs/id/DiYPVdygkfjDWhbxGSqAQxwBKmfKnkWQojqeM2rkLb3G"
    method = "POST"
    timeout = 5000
    query = '''{"query": "{ token(id: \"{token_address}\") { derivedETH } }"}'''
    api_key = "${SUBGRAPH_API_KEY}"
    headers = { Content-Type = "application/json" }
[rpc_endpoints]
    [rpc_endpoints.ethereum]
    urls = ["https://mainnet.infura.io/v3/${INFURA_API_KEY}", "https://eth-mainnet.alchemyapi.io/v2/${ALCHEMY_API_KEY}", "https://rpc.ankr.com/eth"]

